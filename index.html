<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaskSense · Face Mask Detector</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div id="loading-overlay">
    <div class="big-spinner"></div>
    <div class="loading-text">Analyzing faces…</div>
  </div>

  <div id="toast"></div>

  <div class="wrapper">
    <header>
      <div class="logo-mark">🎭</div>
      <div class="logo-text">Mask<span>Sense</span></div>
      <div class="badge">EfficientNet · MTCNN</div>
    </header>

    <!-- server URL -->
    <div class="url-bar">
      <div class="status-dot" id="status-dot"></div>
      <input class="url-input" id="server-url" value="http://localhost:8000" placeholder="FastAPI server URL" />
      <button class="btn btn-outline" style="width:auto; padding:10px 18px;" onclick="checkHealth()">Ping</button>
    </div>

    <div class="grid">
      <!-- LEFT: Input -->
      <div class="card">
        <div class="card-title">// input source</div>

        <!-- Upload -->
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" accept="image/*" />
          <span class="upload-icon">📂</span>
          <div class="upload-hint">
            <strong>Drop an image here</strong><br>
            or click to browse<br>
            <small style="color:var(--muted);">JPG · PNG · WEBP</small>
          </div>
        </div>

        <div id="preview-container">
          <img id="preview-img" src="" alt="preview" />
          <button class="clear-btn" id="clear-btn" title="Remove">✕</button>
        </div>

        <div class="divider">or</div>

        <!-- Webcam -->
        <div id="webcam-section">
          <video id="webcam" autoplay playsinline></video>
          <div class="webcam-controls">
            <button class="btn btn-primary" id="capture-btn">📸 Capture</button>
            <button class="btn btn-outline" id="stop-webcam-btn">Stop</button>
          </div>
        </div>

        <button class="btn btn-outline" id="webcam-btn">📷 Use Webcam</button>

        <div style="margin-top:14px;">
          <button class="btn btn-primary" id="detect-btn" disabled>
            <div class="spinner" id="btn-spinner"></div>
            <span id="btn-text">🔍 Detect Masks</span>
          </button>
        </div>
      </div>

      <!-- RIGHT: Results -->
      <div class="card" id="results-card">
        <div class="card-title">// detection results</div>

        <div id="result-image-container">
          <img id="result-image" src="" alt="Annotated result" />
        </div>

        <div class="stats-row" id="stats-row" style="display:none;">
          <div class="stat">
            <div class="stat-num" id="stat-total">0</div>
            <div class="stat-label">Faces</div>
          </div>
          <div class="stat">
            <div class="stat-num green" id="stat-masked">0</div>
            <div class="stat-label">Masked</div>
          </div>
          <div class="stat">
            <div class="stat-num red" id="stat-unmasked">0</div>
            <div class="stat-label">No Mask</div>
          </div>
        </div>

        <div class="face-list" id="face-list">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon">🕵️</div>
            <p>Upload an image or use your webcam,<br>then hit <strong>Detect Masks</strong> to analyze.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="index.js"></script>

</body>

</html>
